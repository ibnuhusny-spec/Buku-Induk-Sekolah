<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPDB Kilat - SDIT Qurratu A'yun Al-Islami</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-20">
    <nav class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🎓</span>
                <div>
                    <h1 class="text-xl font-bold leading-tight">PPDB Kilat - SPMB</h1>
                    <p class="text-xs text-blue-200">SDIT Qurratu A'yun Al-Islami Maros</p>
                </div>
            </div>
            <a href="index.html" class="bg-blue-800 hover:bg-blue-900 px-4 py-2 rounded-lg text-sm font-bold transition-all border border-blue-600">
                ⬅ Kembali
            </a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto mt-8 px-4">
        <form id="formPPDB" class="space-y-6">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-blue-700 mb-4 border-b pb-2 flex items-center gap-2">
                    <span>📝</span> Data Pendaftaran
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">No. Pendaftaran</label><input type="text" id="in_no_daftar" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500 focus:bg-white transition-all"></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">NISN</label><input type="text" id="in_nisn" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500 focus:bg-white transition-all"></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">NIK Siswa</label><input type="text" id="in_nik" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500 focus:bg-white transition-all"></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Ditempatkan di Kelas</label><input type="text" id="in_rombel" placeholder="Contoh: Kelas 1A Putra" required class="w-full border-2 border-emerald-300 p-2.5 rounded-lg bg-emerald-50 outline-none focus:border-emerald-500 font-bold text-emerald-800"></div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-blue-700 mb-4 border-b pb-2 flex items-center gap-2">
                    <span>👦👧</span> Data Peserta Didik
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nama Lengkap Siswa</label><input type="text" id="in_nama" required class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500 font-bold text-lg uppercase"></div>
                    
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tempat Lahir</label><input type="text" id="in_tmpt_lahir" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500"></div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tanggal Lahir</label><input type="date" id="in_tgl_lahir" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500"></div>
                    
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Jenis Kelamin</label>
                        <select id="in_jk" required class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500">
                            <option value="">-- Pilih --</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Asal Sekolah (TK/RA)</label><input type="text" id="in_asal_sekolah" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500"></div>
                    
                    <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Alamat Lengkap</label><textarea id="in_alamat" rows="2" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500" placeholder="Nama Jalan, RT/RW, Dusun, Desa/Kelurahan..."></textarea></div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-blue-700 mb-4 border-b pb-2 flex items-center gap-2">
                        <span>👨</span> Data Ayah
                    </h2>
                    <div class="space-y-4">
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nama Ayah (Sesuai KTP)</label><input type="text" id="in_nama_ayah" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tahun Lahir</label><input type="number" id="in_thn_ayah" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none"></div>
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Pekerjaan</label><input type="text" id="in_kerja_ayah" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none"></div>
                        </div>
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">No. HP / WhatsApp Ayah</label><input type="text" id="in_hp_ayah" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none"></div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-blue-700 mb-4 border-b pb-2 flex items-center gap-2">
                        <span>👩</span> Data Ibu
                    </h2>
                    <div class="space-y-4">
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nama Ibu (Sesuai KTP)</label><input type="text" id="in_nama_ibu" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none focus:border-blue-500"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tahun Lahir</label><input type="number" id="in_thn_ibu" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none"></div>
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Pekerjaan</label><input type="text" id="in_kerja_ibu" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none"></div>
                        </div>
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">No. HP / WhatsApp Ibu</label><input type="text" id="in_hp_ibu" class="w-full border p-2.5 rounded-lg bg-slate-50 outline-none"></div>
                    </div>
                </div>
            </div>

            <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-50">
                <div class="max-w-5xl mx-auto flex justify-end gap-4">
                    <button type="reset" class="px-6 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">
                        Bersihkan Form
                    </button>
                    <button type="submit" id="btnSimpan" class="px-8 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md transition-all flex items-center gap-2">
                        <span>💾</span> Simpan Data Siswa Baru
                    </button>
                </div>
            </div>
        </form>
    </main>

    <script type="module">
        import { supabase } from './js/supabaseConfig.js';

        // 🛡️ Pengaman Session Login
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; }

        document.getElementById('formPPDB').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnSimpan');
            const teksAsli = btn.innerHTML;
            btn.innerHTML = `⏳ Menyimpan...`;
            btn.disabled = true;

            try {
                // Tangani Tahun Lahir & Kontak Orang Tua
                const thnAyah = document.getElementById('in_thn_ayah').value;
                const tglLahirAyah = thnAyah ? `${thnAyah}-01-01` : null;
                const thnIbu = document.getElementById('in_thn_ibu').value;
                const tglLahirIbu = thnIbu ? `${thnIbu}-01-01` : null;

                const nohpAyah = document.getElementById('in_hp_ayah').value.trim();
                const nohpIbu = document.getElementById('in_hp_ibu').value.trim();
                const asalSekolah = document.getElementById('in_asal_sekolah').value.trim();
                const noDaftar = document.getElementById('in_no_daftar').value.trim();
                const nik = document.getElementById('in_nik').value.trim();

                let alamatLengkapSiswa = document.getElementById('in_alamat').value.trim();
                let catatanTambahan = [];
                if (asalSekolah) catatanTambahan.push(`Asal TK: ${asalSekolah}`);
                if (nik) catatanTambahan.push(`NIK: ${nik}`);
                if (catatanTambahan.length > 0) {
                    alamatLengkapSiswa += (alamatLengkapSiswa ? ' | ' : '') + catatanTambahan.join(', ');
                }

                const payload = {
                    nama_lengkap: document.getElementById('in_nama').value.toUpperCase().trim(),
                    nisn: document.getElementById('in_nisn').value.trim() || null,
                    nipd: noDaftar || null,
                    rombel: document.getElementById('in_rombel').value.trim(),
                    jenis_kelamin: document.getElementById('in_jk').value,
                    tempat_lahir: document.getElementById('in_tmpt_lahir').value.trim() || null,
                    tanggal_lahir: document.getElementById('in_tgl_lahir').value || null,
                    alamat_siswa: alamatLengkapSiswa || null,
                    
                    nama_ayah: document.getElementById('in_nama_ayah').value.trim() || null,
                    tanggal_lahir_ayah: tglLahirAyah,
                    pekerjaan_ayah: document.getElementById('in_kerja_ayah').value.trim() || null,
                    alamat_ayah: nohpAyah ? `No. HP/WA: ${nohpAyah}` : null,
                    
                    nama_ibu: document.getElementById('in_nama_ibu').value.trim() || null,
                    tanggal_lahir_ibu: tglLahirIbu,
                    pekerjaan_ibu: document.getElementById('in_kerja_ibu').value.trim() || null,
                    alamat_ibu: nohpIbu ? `No. HP/WA: ${nohpIbu}` : null,

                    status: 'Aktif',
                    tahun_masuk: new Date().getFullYear()
                };

                // Kirim ke Supabase
                const { error } = await supabase
                    .from('buku_induk')
                    .insert([payload]);

                if (error) throw error;

                // Jika Berhasil
                alert("✅ Alhamdulillah! Data Siswa Baru berhasil disimpan ke Buku Induk.");
                document.getElementById('formPPDB').reset(); // Kosongkan form untuk anak berikutnya
                document.getElementById('in_no_daftar').focus(); // Arahkan kursor kembali ke atas

            } catch (error) {
                console.error("Error Simpan PPDB:", error);
                alert("❌ Gagal menyimpan data: " + error.message);
            } finally {
                btn.innerHTML = teksAsli;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
